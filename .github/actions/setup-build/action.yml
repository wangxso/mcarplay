name: Set up mcarplay build
description: Install JDK 21, Android SDK 35, Gradle caching and the Python diagnostic tool dependencies.

inputs:
  gradle-cache-read-only:
    description: Whether the Gradle cache is restored without being written back.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        log-accepted-android-sdk-licenses: 'false'
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/requirements.txt
    - name: Install diagnostic tool dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r tools/requirements.txt
        chmod +x gradlew
