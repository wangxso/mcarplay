name: QuotaFlow CI fix smoke

on:
  pull_request:
    paths:
      - .github/workflows/quotaflow-ci-fix-smoke.yml
      - tools/quotaflow_ci_fix_smoke.py
      - tools/test_quotaflow_ci_fix_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-code-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run focused smoke test
        run: python3 -m unittest tools.test_quotaflow_ci_fix_smoke -v
