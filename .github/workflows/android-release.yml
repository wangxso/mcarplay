name: Signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check tag and test tools
        run: |
          python - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'val appVersionName = "([0-9]+\.[0-9]+\.[0-9]+)"', source).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          base_tag = 'v' + version
          test_tag = re.fullmatch(re.escape(base_tag) + r'-test\.[0-9]+', tag)
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and tag != base_tag and not test_tag:
              raise SystemExit('Tag must be ' + base_tag + ' or ' + base_tag + '-test.N')
          PY
          python -m pip install -r tools/requirements.txt
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Prepare changelog release notes
        if: github.ref_type == 'tag'
        run: |
          python tools/release_notes.py --tag "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mcarplay-release.jks"
          printf 'MCARPLAY_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/mcarplay-release.jks" >> "$GITHUB_ENV"
      - name: Check and assemble signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -Pmcarplay.requireReleaseSigning=true \
            spotlessCheck :app:testStandardDebugUnitTest :app:lintStandardRelease :app:assembleStandardRelease
      - name: Verify and package signed APK
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          output = pathlib.Path('app/build/outputs/apk/standard/release')
          info = json.loads((output / 'output-metadata.json').read_text())['elements'][0]
          target = pathlib.Path('dist/release')
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(output / info['outputFile'], target / ('mcarplay-' + info['versionName'] + '.apk'))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/release/*.apk > dist/release/signing-certificate.txt
          cd dist/release
          sha256sum ./*.apk > SHA256SUMS.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcarplay-signed-${{ github.run_number }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$GITHUB_REF_NAME" =~ -test\.[0-9]+$ ]]; then
            release_args+=(--prerelease --title "mcarplay $GITHUB_REF_NAME (test)")
          else
            release_args+=(--title "mcarplay $GITHUB_REF_NAME")
          fi
          gh release create "$GITHUB_REF_NAME" dist/release/* "${release_args[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mcarplay-release.jks"
